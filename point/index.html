<title>Où en êtes-vous ?</title>
<!--
  Page « Demander un point » de Cosmo : le salarié, sur le chantier, dit où il en est en deux appuis.
  Statique : à publier telle quelle sur un hébergement HTTPS, à côté de la page du devis (voir MISE-EN-SERVICE.md), puis donner
  son adresse au serveur : supabase secrets set COSMO_POINT_PAGE=https://…/point/
  Elle lit le chantier et envoie la réponse à la fonction Supabase cosmo-point (JSON, CORS).
  Essai sur le Mac : node server/dev.mjs, puis http://127.0.0.1:8787/point/?demo=1 (sans serveur) ou le lien rendu par « creer ».
-->
<style>
  :root {
    --fond: #f6f6f4; --carte: #ffffff; --encre: #15161b; --doux: #5f6168; --pale: #8c8e95; --trait: #e7e7e3; --champ: #d6d6d1;
    --gris: #ececea; --vert: #138a46; --vert-fond: #e8f6ee; --bleu: #2f4fb0; --bleu-fond: #eaeefa; --orange: #b54708;
    --orange-fond: #fdf0e6; --rouge: #b42318; --accent: #ff5a1f; --sur: #ffffff;
    --rayon: 18px; --ombre: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1013; --carte: #1b1c21; --encre: #f3f3f1; --doux: #b3b5bc; --pale: #8e9097; --trait: #2c2d33; --champ: #3a3b42;
      --gris: #2a2b31; --vert: #2fbf6c; --vert-fond: #12301f; --bleu: #7d9bff; --bleu-fond: #1b2340; --orange: #ff9a4d;
      --orange-fond: #3a2412; --rouge: #ff7a6b; --sur: #0f1013;
      --ombre: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fond); color: var(--encre);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left)); }
  main.sans-barre { padding-bottom: max(32px, env(safe-area-inset-bottom)); }
  .entreprise { display: flex; align-items: center; gap: 12px; margin: 2px 0 16px; }
  .monogramme { width: 44px; height: 44px; border-radius: 12px; background: var(--encre); color: var(--fond); display: grid;
    place-items: center; font-weight: 700; font-size: 17px; flex: none; }
  .entreprise b { display: block; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
  .entreprise span { color: var(--doux); font-size: 14px; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 14px; overflow-wrap: anywhere; }
  h2 { font-size: 15px; font-weight: 700; color: var(--doux); margin: 22px 0 10px; }
  .carte { background: var(--carte); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 16px 18px; }
  .chantier .titre { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 6px; overflow-wrap: anywhere; }
  .chantier .info { display: flex; gap: 10px; align-items: flex-start; color: var(--doux); font-size: 15px; margin: 4px 0 0; overflow-wrap: anywhere; }
  .chantier .info svg { flex: none; margin-top: 2px; color: var(--pale); }
  .chantier .quand { color: var(--encre); font-weight: 600; }

    border: 2px solid transparent; background: var(--carte); box-shadow: var(--ombre); color: var(--encre); font: inherit; text-align: left;
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;

  .etat .coche { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--champ); flex: none;
    display: grid; place-items: center; color: transparent; }
  .etat.termine .rond { background: var(--vert-fond); color: var(--vert); }
  .etat.en_cours .rond { background: var(--bleu-fond); color: var(--bleu); }
  .etat.souci .rond { background: var(--orange-fond); color: var(--orange); }
  .etat[aria-pressed="true"] { color: var(--sur); }
  .etat[aria-pressed="true"] small { color: inherit; opacity: .85; }
  .etat[aria-pressed="true"] .rond { background: rgba(255,255,255,.2); color: inherit; }
  .etat[aria-pressed="true"] .coche { border-color: var(--sur); background: var(--sur); }
  .etat.termine[aria-pressed="true"] { background: var(--vert); }
  .etat.en_cours[aria-pressed="true"] { background: var(--bleu); }
  .etat.souci[aria-pressed="true"] { background: var(--orange); }
  .etat.termine[aria-pressed="true"] .coche svg { color: var(--vert); }
  .etat.en_cours[aria-pressed="true"] .coche svg { color: var(--bleu); }
  .etat.souci[aria-pressed="true"] .coche svg { color: var(--orange); }
  .etats.choisi .etat[aria-pressed="false"] { opacity: .62; box-shadow: none; }
  .avancement { margin: 4px 0 2px; }
  .avancement .pastille { flex: 1 1 auto; }
  .avancement .pastille[aria-pressed="true"] { background: var(--bleu); border-color: var(--bleu); color: var(--sur); }
  label.titre-champ { display: block; font-size: 15px; font-weight: 700; color: var(--doux); margin: 22px 0 8px; }
  label.titre-champ.oblige { color: var(--orange); }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 14px;
    border: 1.5px solid var(--champ); background: var(--carte); color: var(--encre); }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: 2px solid var(--encre); outline-offset: 0; border-color: transparent; }
  textarea.manque { border-color: var(--orange); }
  .ajout-photo { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; margin-top: 12px;
    border-radius: 14px; border: 1.5px dashed var(--champ); background: transparent; color: var(--encre); font: inherit; font-size: 17px;
    font-weight: 600; cursor: pointer; touch-action: manipulation; }
  .ajout-photo[disabled] { opacity: .5; cursor: default; }
  .vignettes { display: flex; gap: 10px; margin-top: 12px; }
  .vignettes:empty { display: none; }
  .vignette { position: relative; width: 96px; height: 96px; border-radius: 14px; overflow: hidden; background: var(--gris); flex: none; }
  .vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vignette button { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.62); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .vignette.prepare::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    background-size: 200% 100%; animation: brille 1.1s linear infinite; }
  .aide { color: var(--doux); font-size: 14px; margin: 8px 0 0; }
  .erreur { color: var(--rouge); font-size: 15px; font-weight: 600; margin: 0 0 8px; text-align: center; }
  .erreur:empty { display: none; }
  .barre { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: color-mix(in srgb, var(--fond) 92%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--trait);
    padding: 10px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .barre > div { max-width: 560px; margin: 0 auto; }
  .bouton { display: flex; width: 100%; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 12px 18px;
    border-radius: 16px; border: 0; font: inherit; font-weight: 700; font-size: 19px; cursor: pointer; text-decoration: none;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform .12s ease, opacity .12s ease; }
  .bouton:active { transform: scale(.98); }
  .bouton[disabled] { opacity: .4; cursor: default; transform: none; }
  .principal { background: var(--encre); color: var(--fond); }
  .secondaire { background: var(--gris); color: var(--encre); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .appeler { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin: 26px 0 0; color: var(--doux);
    font-size: 15px; font-weight: 600; text-decoration: none; }
  .appeler span { text-decoration: underline; text-underline-offset: 3px; }
  footer { color: var(--pale); font-size: 12px; text-align: center; margin-top: 10px; }
  .ecran { text-align: center; padding: 30px 20px 26px; }
  .ecran .rond { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; }
  .ecran .rond.ok { background: var(--vert-fond); color: var(--vert); }
  .ecran .rond.non { background: var(--gris); color: var(--doux); }
  .ecran h1 { font-size: 26px; margin: 0; }
  .ecran p { color: var(--doux); margin: 8px 0 0; overflow-wrap: anywhere; }
  .resume { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--gris); text-align: left; }
  .resume b { display: block; font-size: 18px; }
  .resume p { margin: 4px 0 0; color: var(--doux); white-space: pre-line; overflow-wrap: anywhere; }
  .ecran .bouton { margin-top: 20px; }
  .chargement { height: 120px; border-radius: var(--rayon); margin-bottom: 12px;
    background: linear-gradient(90deg, var(--gris) 0%, var(--carte) 50%, var(--gris) 100%); background-size: 200% 100%;
    animation: brille 1.2s linear infinite; }
  .chargement.court { height: 40px; width: 60%; }
  @keyframes brille { to { background-position: -200% 0; } }
  .apparait { animation: monte .22s ease-out both; }
  @keyframes monte { from { opacity: 0; transform: translateY(6px); } }
  .cache { display: none !important; }
  .lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    .chargement, .vignette.prepare::after { animation: none; }

    .etat, .bouton { transition: none; }
    .etat:active, .bouton:active { transform: none; }
  }
</style>
</head>
<body>
<main id="page" aria-live="polite">
  <div class="chargement court" aria-hidden="true"></div>
  <div class="chargement" aria-label="Chargement"></div>
</main>
<script>
"use strict";
// Fonction du serveur. Sur le Mac (serveur d'essai server/dev.mjs, adresse locale ou du Wi-Fi), la page parle au même
// serveur ; ?api=… n'est accepté qu'en localhost. Ailleurs, toujours la fonction de Supabase.
const API_DEFAUT = "https://zqbosemrskrwvzlsaqay.supabase.co/functions/v1/cosmo-point";
const params = new URLSearchParams(location.search);
const hote = location.hostname;
const local = ["localhost", "127.0.0.1"].includes(hote);
const reseauLocal = local || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(hote) || hote.endsWith(".local");
const API = (local && params.get("api")) || (reseauLocal && location.protocol === "http:" ? location.origin + "/cosmo-point" : API_DEFAUT);
const demo = params.get("demo") === "1";
const jeton = params.get("t") || "";
const page = document.getElementById("page");
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Point lu (ou d'exemple), et ce que la personne est en train de saisir : gardé tant que la page est ouverte */
let point = null;
const saisie = { nom: "", etat: "", avancement: null, mot: "", photos: [] };
let envoiEnCours = false;

// MARK: Petits outils (jamais d'HTML venu du serveur : textContent seulement)

function el(tag, attrs = {}, ...enfants) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of enfants.flat()) if (c !== null && c !== undefined && c !== false && c !== "") e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

/** Icônes au trait, dessinées ici (24 × 24) */
const TRACES = {
  termine: ["M5 12.5l4.5 4.5L19 7.5"],
  en_cours: ["M12 3a9 9 0 1 0 9 9", "M12 7v5l3.5 2"],
  souci: ["M12 4L2.8 19.5h18.4z", "M12 10v4.5", "M12 17.2v.3"],
  coche: ["M6 12.5l4 4L18 8.5"],
  lieu: ["M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z", "M12 12.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6z"],
  heure: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M12 7.5V12l3 2"],
  dossier: ["M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"],
  photo: ["M4 8.5a2 2 0 0 1 2-2h2l1.6-2h4.8l1.6 2h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z", "M12 16a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"],
  retirer: ["M7 7l10 10", "M17 7L7 17"],
  telephone: ["M5 4h3.5l1.5 4.5-2.2 1.4a11 11 0 0 0 6.3 6.3l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.6A1.5 1.5 0 0 1 5 4z"],
  lien: ["M9 15l6-6", "M10.5 6.5l1.8-1.8a4 4 0 0 1 5.7 5.7l-1.8 1.8", "M13.5 17.5l-1.8 1.8a4 4 0 0 1-5.7-5.7l1.8-1.8"],
  horloge: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M12 7.5V12"],
  reseau: ["M3 9.5a13 13 0 0 1 18 0", "M6.5 13a8 8 0 0 1 11 0", "M10 16.5a3 3 0 0 1 4 0", "M12 20v.2"],
};
function icone(nom, taille = 24, epaisseur = 2) {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  for (const [k, v] of Object.entries({ width: taille, height: taille, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": epaisseur, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true", focusable: "false" })) s.setAttribute(k, v);
  for (const d of TRACES[nom] || []) { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); s.append(p); }
  return s;
}

function initiales(nom) {
  return (nom || "").split(/\s+/).filter((m) => /[A-Za-zÀ-ÿ]/.test(m)).slice(0, 2).map((m) => m[0]).join("").toUpperCase() || "·";
}

const memeJour = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
/** « 8 h 30 », « 14 h » (espaces insécables : jamais coupé en fin de ligne) */
const heure = (d) => d.getHours() + "\u00a0h" + (d.getMinutes() ? "\u00a0" + String(d.getMinutes()).padStart(2, "0") : "");

/** « Aujourd'hui · 8 h 30 », « Demain · 14 h », « jeudi 13 novembre · 8 h 30 » ; date seule : sans l'heure */
function quand(iso) {
  if (!iso) return "";
  const dateSeule = /^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d = new Date(dateSeule ? iso + "T12:00:00" : iso);
  if (Number.isNaN(d.getTime())) return "";
  const auj = new Date();
  const dem = new Date(auj); dem.setDate(auj.getDate() + 1);
  const hier = new Date(auj); hier.setDate(auj.getDate() - 1);
  const jour = memeJour(d, auj) ? "Aujourd'hui" : memeJour(d, dem) ? "Demain" : memeJour(d, hier) ? "Hier"
    : d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }).replace(/^./, (c) => c.toUpperCase());
  return dateSeule ? jour : jour + " · " + heure(d);
}

/** « à 10 h 12 », « hier à 18 h », « le 10 nov. à 9 h » */
function moment(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const auj = new Date();
  const hier = new Date(auj); hier.setDate(auj.getDate() - 1);
  if (memeJour(d, auj)) return "à " + heure(d);
  if (memeJour(d, hier)) return "hier à " + heure(d);
  return "le " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " à " + heure(d);
}

const ETATS = {
  termine: { libelle: "Terminé", aide: "Le travail est fini" },
  en_cours: { libelle: "En cours", aide: "Ça avance" },
  souci: { libelle: "Un souci", aide: "Quelque chose bloque" },
};
const AVANCEMENTS = [[25, "25 %"], [50, "50 %"], [75, "75 %"], [90, "Presque fini"]];

/** « en cours (50 %) », « terminé », « un souci » */
function etatCourt(r) {
  if (r.etat === "termine") return "terminé";
  if (r.etat === "souci") return "un souci";
  return typeof r.avancement === "number" ? (r.avancement >= 90 ? "presque fini" : "en cours (" + r.avancement + " %)") : "en cours";
}

const nomEntreprise = () => point?.entreprise?.nom || "l'entreprise";
const telephone = (e) => (e?.telephone || "").replace(/[^\d+]/g, "");

function afficher(noeuds, { barre = null } = {}) {
  page.classList.toggle("sans-barre", !barre);
  page.replaceChildren(...noeuds.filter(Boolean));
  document.querySelector(".barre")?.remove();
  if (barre) document.body.append(barre);
}

function entete(e) {
  if (!e?.nom) return null;
  return el("div", { class: "entreprise" },
    el("div", { class: "monogramme", "aria-hidden": "true" }, initiales(e.nom)),
    el("div", {}, el("b", {}, e.nom), el("span", {}, "Demande de point")));
}

function appeler(e) {
  const tel = telephone(e);
  if (!tel) return null;
  return el("a", { class: "appeler", href: "tel:" + tel }, icone("telephone", 18), el("span", {}, "Appeler " + (e.nom || e.telephone)));
}

function pied() { return el("footer", {}, "Page sécurisée · Envoyé avec Cosmo"); }

/** Écran d'état (lien inconnu, expiré, clos, erreur) */
function ecran({ symbole, genre = "non", titre, texte, entreprise, action }) {
  document.title = titre;
  afficher([
    entete(entreprise),
    el("section", { class: "carte ecran apparait" },
      el("div", { class: "rond " + genre }, icone(symbole, 34)),
      el("h1", {}, titre), texte ? el("p", {}, texte) : null, action || null),
    appeler(entreprise), pied(),
  ]);
}

// MARK: Chargement

async function charger() {
  if (demo) { point = exemple(); return formulaire(); }
  if (!/^[A-Za-z0-9_-]{43}$/.test(jeton)) {
    return ecran({ symbole: "lien", titre: "Lien incomplet", texte: "Ouvrez le lien reçu par SMS, en entier." });
  }
  afficher([el("div", { class: "chargement court", "aria-hidden": "true" }), el("div", { class: "chargement", "aria-label": "Chargement" })]);
  try {
    const r = await fetch(API + "?t=" + encodeURIComponent(jeton), { cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) return ecran({ symbole: "lien", titre: "Ce lien n'existe pas", texte: "Vérifiez qu'il est complet, ou demandez un nouveau lien." });
    if (r.status === 410) return ecran({ symbole: "horloge", titre: "Ce lien a expiré", texte: "Il était valable 7 jours. " + (j.entreprise?.nom ? "Appelez " + j.entreprise.nom + " pour donner des nouvelles." : ""), entreprise: j.entreprise });
    if (!r.ok) return ecran({ symbole: "reseau", titre: "Page indisponible", texte: j.error || "Réessayez dans un instant.", action: boutonRecharger() });
    point = j;
    if (point.clos) return clos();
    formulaire();
  } catch {
    ecran({ symbole: "reseau", titre: "Pas de connexion", texte: "Vérifiez le réseau, puis réessayez.", action: boutonRecharger() });
  }
}

function boutonRecharger() {
  return el("button", { class: "bouton secondaire", type: "button", onclick: charger }, "Réessayer");
}

function clos() {
  const e = point?.entreprise || {};
  ecran({ symbole: "coche", titre: "Ce point est clos",
    texte: telephone(e) ? "Il n'attend plus de réponse. Appelez " + (e.nom || "l'entreprise") + " si besoin." : "Il n'attend plus de réponse.", entreprise: e });
}

// MARK: Formulaire

function formulaire() {
  const p = point;
  const e = p.entreprise || {};
  const personnes = Array.isArray(p.personnes) ? p.personnes : [];
  if (personnes.length === 1 && !saisie.nom) saisie.nom = personnes[0];
  document.title = (p.question || "Où en êtes-vous ?") + (e.nom ? " · " + e.nom : "");

  // Carte du chantier
  const lignes = [];
  const q = quand(p.debut);
  if (q) lignes.push(el("p", { class: "info quand" }, icone("heure", 18), el("span", {}, q)));
  if (p.lieu) lignes.push(el("p", { class: "info" }, icone("lieu", 18), el("span", {}, p.lieu)));
  if (p.dossier) lignes.push(el("p", { class: "info" }, icone("dossier", 18), el("span", {}, p.dossier)));
  const reponses = Array.isArray(p.reponses) ? p.reponses : [];
  const rappel = reponses.length
    ? el("div", { class: "rappel" }, reponses.slice(-3).map((r) => el("p", {},
        (r.nom ? r.nom + " a" : "Vous avez") + " répondu : " + etatCourt(r) + " " + moment(r.le) + ".")))
    : null;

  // Qui répond ?
  let qui = null;
  if (personnes.length > 1) {
    const zone = el("div", { class: "pastilles", role: "group", "aria-labelledby": "qui" });
    const majQui = () => zone.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.nom === saisie.nom)));
    for (const n of personnes) {
      zone.append(el("button", { class: "pastille", type: "button", "data-nom": n, "aria-pressed": "false",
        onclick: () => { saisie.nom = saisie.nom === n ? "" : n; majQui(); } }, n));
    }
    majQui();
    qui = [el("h2", { id: "qui" }, "Qui répond ?"), zone];
  } else if (personnes.length === 0) {
    const champ = el("input", { type: "text", id: "prenom", autocomplete: "given-name", autocapitalize: "words", enterkeyhint: "done",
      maxlength: "60", placeholder: "Facultatif", oninput: (ev) => { saisie.nom = ev.target.value; } });
    champ.value = saisie.nom;
    qui = [el("label", { class: "titre-champ", for: "prenom" }, "Votre prénom"), champ];
  }

  // Les trois réponses
  const etats = el("div", { class: "etats", role: "group", "aria-labelledby": "question" });
  for (const [cle, d] of Object.entries(ETATS)) {
    etats.append(el("button", { class: "etat " + cle, type: "button", "data-etat": cle, "aria-pressed": "false", "aria-label": d.libelle + ". " + d.aide, onclick: () => choisir(cle) },
      el("span", { class: "rond" }, icone(cle, 26, 2.4)),
      el("span", {}, el("b", {}, d.libelle), el("small", {}, d.aide)),
      el("span", { class: "coche" }, icone("coche", 18, 3))));
  }

  // Avancement (en cours)
  const avancement = el("div", { class: "avancement cache", id: "avancement" },
    el("h2", { id: "titre-avancement" }, "Avancement (facultatif)"),
    el("div", { class: "pastilles", role: "group", "aria-labelledby": "titre-avancement" },
      AVANCEMENTS.map(([v, l]) => el("button", { class: "pastille", type: "button", "data-valeur": String(v), "aria-pressed": "false",
        onclick: () => { saisie.avancement = saisie.avancement === v ? null : v; majAvancement(); } }, l))));

  // Un mot, des photos
  const titreMot = el("label", { class: "titre-champ", for: "mot", id: "titre-mot" }, "Un mot (facultatif)");
  const mot = el("textarea", { id: "mot", maxlength: "500", rows: "3", autocapitalize: "sentences", placeholder: "Par exemple : reste la peinture du plafond",
    oninput: (ev) => { saisie.mot = ev.target.value; ev.target.classList.remove("manque"); erreur(""); } });
  mot.value = saisie.mot;
  const fichier = el("input", { type: "file", accept: "image/*", capture: "environment", class: "cache", id: "fichier", onchange: ajouterPhoto });
  const ajout = el("button", { class: "ajout-photo", type: "button", id: "ajout", onclick: () => fichier.click() }, icone("photo", 22), "Ajouter une photo");
  const vignettes = el("div", { class: "vignettes", id: "vignettes" });

  // Barre du bas
  const message = el("p", { class: "erreur", id: "erreur", role: "alert" });
  const envoyer = el("button", { class: "bouton principal", type: "button", id: "envoyer", disabled: true, onclick: envoyerReponse }, "Envoyer");
  const barre = el("div", { class: "barre" }, el("div", {}, message, envoyer));

  afficher([
    entete(e),
    el("h1", { id: "question" }, p.question || "Où en êtes-vous ?"),
    el("section", { class: "carte chantier", "aria-label": "Le chantier" }, el("p", { class: "titre" }, p.titre || "Chantier"), lignes, rappel),
    qui,
    el("h2", {}, "Votre réponse"),
    etats, avancement,
    titreMot, mot, fichier, ajout, vignettes,
    appeler(e), pied(),
  ].flat(), { barre });
  majEtat();
  majAvancement();
  majPhotos();
}

function choisir(cle) {
  saisie.etat = saisie.etat === cle ? "" : cle;
  if (saisie.etat !== "en_cours") saisie.avancement = null;
  majEtat();
  majAvancement();
  if (saisie.etat === "souci") {
    const mot = document.getElementById("mot");
    mot.focus({ preventScroll: true });
    mot.scrollIntoView({ behavior: reduit ? "auto" : "smooth", block: "center" });
  }
}

function majEtat() {
  const zone = document.querySelector(".etats");
  if (!zone) return;
  zone.classList.toggle("choisi", !!saisie.etat);
  zone.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.etat === saisie.etat)));
  document.getElementById("avancement").classList.toggle("cache", saisie.etat !== "en_cours");
  const souci = saisie.etat === "souci";
  const titre = document.getElementById("titre-mot");
  titre.textContent = souci ? "Qu'est-ce qui bloque ?" : "Un mot (facultatif)";
  titre.classList.toggle("oblige", souci);
  const mot = document.getElementById("mot");
  mot.required = souci;
  mot.setAttribute("aria-required", String(souci));
  mot.placeholder = souci ? "Par exemple : il manque les joints" : "Par exemple : reste la peinture du plafond";
  document.getElementById("envoyer").disabled = !saisie.etat || envoiEnCours;
  erreur("");
}

function majAvancement() {
  document.querySelectorAll("#avancement button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.valeur) === saisie.avancement)));
}

function erreur(texte) {
  const e = document.getElementById("erreur");
  if (e) e.textContent = texte;
}

// MARK: Photos (réduites dans la page : 1280 px au plus, JPEG, moins de 550 Ko)

const PHOTOS_MAX = 2;
const OCTETS_MAX = 550 * 1024;

function majPhotos() {
  const zone = document.getElementById("vignettes");
  if (!zone) return;
  zone.replaceChildren(...saisie.photos.map((ph, i) => el("div", { class: "vignette" + (ph.base64 ? "" : " prepare") },
    el("img", { src: ph.apercu, alt: "Photo " + (i + 1) }),
    el("button", { type: "button", "aria-label": "Retirer la photo " + (i + 1), onclick: () => retirerPhoto(i) }, icone("retirer", 18, 2.4)))));
  const ajout = document.getElementById("ajout");
  ajout.disabled = saisie.photos.length >= PHOTOS_MAX;
  ajout.lastChild.textContent = saisie.photos.length >= PHOTOS_MAX ? "Deux photos au plus" : saisie.photos.length ? "Ajouter une autre photo" : "Ajouter une photo";
}

function retirerPhoto(i) {
  const [ph] = saisie.photos.splice(i, 1);
  if (ph?.apercu) URL.revokeObjectURL(ph.apercu);
  majPhotos();
}

async function ajouterPhoto(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = "";
  if (!f || saisie.photos.length >= PHOTOS_MAX) return;
  const ph = { apercu: URL.createObjectURL(f), base64: "" };
  saisie.photos.push(ph);
  majPhotos();
  try {
    const jpeg = await reduire(f);
    URL.revokeObjectURL(ph.apercu);
    ph.apercu = URL.createObjectURL(jpeg);
    ph.base64 = await enBase64(jpeg);
  } catch {
    const i = saisie.photos.indexOf(ph);
    if (i >= 0) retirerPhoto(i);
    erreur("Cette photo n'a pas pu être lue. Essayez-en une autre.");
    return;
  }
  majPhotos();
}

function chargerImage(f) {
  return new Promise((ok, ko) => {
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("image")); };
    img.src = url;
  });
}

const versBlob = (toile, qualite) => new Promise((ok) => toile.toBlob(ok, "image/jpeg", qualite));

/** Photo réduite : côté le plus long à 1280 px (puis 960), qualité 0,7 descendue jusqu'à passer sous 550 Ko */
async function reduire(f) {
  const img = await chargerImage(f);
  for (const cote of [1280, 960, 720]) {
    const k = Math.min(1, cote / Math.max(img.naturalWidth, img.naturalHeight));
    const toile = document.createElement("canvas");
    toile.width = Math.max(1, Math.round(img.naturalWidth * k));
    toile.height = Math.max(1, Math.round(img.naturalHeight * k));
    const c = toile.getContext("2d");
    c.fillStyle = "#fff";
    c.fillRect(0, 0, toile.width, toile.height);
    c.drawImage(img, 0, 0, toile.width, toile.height);
    for (const q of [0.7, 0.6, 0.5, 0.4]) {
      const b = await versBlob(toile, q);
      if (b && b.size <= OCTETS_MAX) return b;
    }
  }
  throw new Error("trop lourde");
}

function enBase64(blob) {
  return new Promise((ok, ko) => {
    const l = new FileReader();
    l.onload = () => ok(String(l.result).replace(/^data:[^,]*,/, ""));
    l.onerror = ko;
    l.readAsDataURL(blob);
  });
}

// MARK: Envoi

async function envoyerReponse() {
  if (!saisie.etat || envoiEnCours) return;
  const mot = saisie.mot.trim();
  if (saisie.etat === "souci" && !mot) {
    const champ = document.getElementById("mot");
    champ.classList.add("manque");
    champ.focus();
    return erreur("Dites en un mot ce qui bloque.");
  }
  if (saisie.photos.some((ph) => !ph.base64)) return erreur("Une photo se prépare encore. Un instant…");
  const corps = { action: "repondre", t: jeton, etat: saisie.etat, mot, nom: saisie.nom.trim(), photos: saisie.photos.map((ph) => ph.base64) };
  if (saisie.etat === "en_cours" && saisie.avancement !== null) corps.avancement = saisie.avancement;

  const bouton = document.getElementById("envoyer");
  envoiEnCours = true;
  bouton.disabled = true;
  bouton.textContent = "Envoi…";
  erreur("");
  try {
    let le;
    if (demo) {
      await new Promise((ok) => setTimeout(ok, 700));
      le = new Date().toISOString();
    } else {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        envoiEnCours = false;
        if (j.code === "clos") return clos();
        if (j.code === "expire") return ecran({ symbole: "horloge", titre: "Ce lien a expiré", texte: "Votre réponse n'a pas pu partir. Appelez " + nomEntreprise() + ".", entreprise: point.entreprise });
        if (j.code === "mot") { document.getElementById("mot").focus(); }
        bouton.disabled = false;
        bouton.textContent = "Réessayer";
        return erreur(j.error || "L'envoi n'a pas abouti. Réessayez.");
      }
      le = j.le || new Date().toISOString();
    }
    envoiEnCours = false;
    confirmation({ etat: corps.etat, avancement: corps.avancement ?? null, mot, nom: corps.nom, le, photos: corps.photos.length });
  } catch {
    envoiEnCours = false;
    bouton.disabled = false;
    bouton.textContent = "Réessayer";
    erreur("Pas de connexion. Votre réponse est gardée : réessayez.");
  }
}

function confirmation(r) {
  point.reponses = [...(point.reponses || []), r];
  // Nouvelle réponse plus tard (« c'est terminé ») : on repart d'une saisie vide, le prénom est gardé
  for (const ph of saisie.photos) URL.revokeObjectURL(ph.apercu);
  Object.assign(saisie, { etat: "", avancement: null, mot: "", photos: [] });
  const libelle = ETATS[r.etat].libelle + (r.etat === "en_cours" && typeof r.avancement === "number" ? (r.avancement >= 90 ? " · presque fini" : " · " + r.avancement + " %") : "");
  const details = [r.photos ? (r.photos === 1 ? "1 photo" : r.photos + " photos") : "", r.nom ? "de " + r.nom : ""].filter(Boolean).join(", ");
  document.title = "C'est envoyé";
  afficher([
    entete(point.entreprise),
    el("section", { class: "carte ecran apparait" },
      el("div", { class: "rond ok" }, icone("coche", 36, 3)),
      el("h1", {}, "C'est envoyé. Merci."),
      el("p", {}, nomEntreprise().replace(/^./, (c) => c.toUpperCase()) + " a reçu votre réponse " + moment(r.le) + "."),
      el("div", { class: "resume" }, el("b", {}, libelle), r.mot ? el("p", {}, r.mot) : null, details ? el("p", {}, details) : null),
      el("button", { class: "bouton secondaire", type: "button", onclick: formulaire }, "Envoyer une autre réponse")),
    appeler(point.entreprise), pied(),
  ]);
  window.scrollTo({ top: 0 });
}

// MARK: Démonstration (?demo=1) : chantier d'exemple, rien n'est envoyé

function exemple() {
  const d = new Date();
  d.setHours(8, 30, 0, 0);
  return {
    entreprise: { nom: "Peinture Martin", telephone: "06 12 34 56 78" },
    titre: "Rénovation salle de bains", lieu: "12 rue des Lilas, 93100 Montreuil", debut: d.toISOString(), dossier: "Famille Durand",
    question: "", personnes: ["Karim", "Julie"], expire: new Date(Date.now() + 7 * 864e5).toISOString(), clos: false, reponses: [],
  };
}
